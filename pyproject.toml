[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "model_steal"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "datasets>=4.0.0",
    "huggingface-hub>=0.34.0",
    "hydra-core>=1.3.2",
    "jaxtyping>=0.3.9",
    "loguru",
    "matplotlib>=3.10.8",
    "mkdocs",
    "pip",
    "pyarrow>=21.0.0",
    "python-dotenv",
    "ruff",
    "soundfile>=0.13.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.8.0",
    "torchvision>=0.26.0",
    "transformers>=4.52.0",
    "tqdm",
    "typer",
    "wandb>=0.25.1",
    "kagglehub>=1.0.1",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["model_steal", "modern_bert_extraction", "modern_audio_extraction"]
include = [
    "pyproject.toml",
    "model_steal/**/*.py",
    "modern_bert_extraction/**/*.py",
    "modern_audio_extraction/**/*.py",
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["model_steal", "modern_bert_extraction", "modern_audio_extraction"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "jupyterlab>=4.5.6",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
