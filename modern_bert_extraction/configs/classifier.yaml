seed: 42

paths:
  glue_dir: external/repro/glue
  wikitext_raw: external/repro/wikitext103/wiki.train.raw
  wikitext_sentences: external/repro/wikitext103/wikitext103-sentences.txt
  output_root: external/repro/modern_classifier

model:
  pretrained_model_name_or_path: google-bert/bert-large-uncased
  max_seq_length: 128
  do_lower_case: true
  gradient_checkpointing: true

training:
  learning_rate: 3.0e-5
  num_train_epochs: 3.0
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  warmup_proportion: 0.1
  weight_decay: 0.0
  max_grad_norm: 1.0
  dataloader_num_workers: 2
  mixed_precision: auto

query_generation:
  max_query_length: 60
  thief_sentence_threshold: 50
  top_k_vocab: 10000
  ed1_changes: 3
  augmentations: 1
  dataset_size: null
  sanitize_samples: true

runtime:
  device: auto
  require_gpu: true
  cuda_visible_devices: null

