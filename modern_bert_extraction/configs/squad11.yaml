defaults:
  - model: bert_large_uncased
  - paths: squad11
  - training: squad11
  - query_generation: qa
  - runtime: gpu
  - _self_

seed: 42

run:
  scheme: random
  step: all

model:
  max_seq_length: 384
  doc_stride: 128
  n_best_size: 20
  max_answer_length: 30

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
